[project]
name = "ticket-loop"
version = "0.0.1"
description = "客服工单端到端竖切：以 eval 为脊柱，走通 L0→L4"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# 依赖按阶段引入，见 docs/02-plan.md「依赖引入节奏」
# P1: openai, scikit-learn, pandas
# P2: torch, transformers, peft, trl, datasets
# P3: httpx, matplotlib
